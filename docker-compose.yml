services:
  db:
    image: postgres:16
    container_name: text2sql_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_pw
      POSTGRES_DB: chinook
    ports:
      - "5432:5432"
    volumes:
      # Scripts run in alphabetical order on first init (empty data volume only).
      - ./seed:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
